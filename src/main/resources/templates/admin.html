<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <title></title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="/app.js"></script>
    <noscript
      ><h2 style="color: #ff0000">
        Seems your browser doesn't support Javascript! Websocket relies on
        Javascript being enabled. Please enable Javascript and reload this page!
      </h2></noscript
    >
  </head>
  <body>
    <h1>Panel de admin</h1>
    <form method="post" action="/matches">
      <div class="row">
        <div class="col">
          <label>Elige luchador izquierda</label>
          <select
            class="form-select mr-sm-2"
            id="esquina-izquierda-id"
            th:name="equina-izquierda"
          >
            <option selected>Elige luchador...</option>
            <option
              th:each="fighter : ${fighters}"
              th:text="${fighter.name}"
              th:value="${fighter.id}"
            ></option>
          </select>
        </div>
        <div class="col">
          <label>Elige luchador derecha</label>
          <select
            class="form-select mr-sm-2"
            id="esquina-derecha-id"
            th:name="equina-derecha"
          >
            <option selected>Elige luchador...</option>
            <option
              th:each="fighter : ${fighters}"
              th:text="${fighter.name}"
              th:value="${fighter.id}"
            ></option>
          </select>
        </div>
      </div>
      <div class="col-auto">
        <button type="submit" class="btn btn-primary">Crear lucha</button>
      </div>
    </form>
  </body>
</html>
